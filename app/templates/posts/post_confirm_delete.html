{% extends 'posts/base.html' %}

{% block content %}
<div class="bg-white rounded-2xl p-5 shadow-sm space-y-4 text-center">
  <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto text-lg">
    <i class="fa-solid fa-trash"></i>
  </div>
  <h1 class="text-base font-bold text-gray-800">Deletar Post?</h1>
  <p class="text-xs text-gray-500">Tem certeza de que deseja remover o post "<strong>{{ object.titulo }}</strong>"? Esta ação não pode ser desfeita.</p>

  <form method="post" class="flex justify-center gap-3 pt-2">
    {% csrf_token %}
    <a href="{% url 'post_list' %}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl text-xs font-semibold text-gray-600 transition">
      Cancelar
    </a>
    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-xs font-semibold text-white transition">
      Confirmar Exclusão
    </button>
  </form>
</div>
{% endblock %}
